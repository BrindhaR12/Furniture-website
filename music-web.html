    <style>
        body{
            background-color:black;
            margin:0;
        }
        .main{
            width:100vw;
            height:100vh;
            background-color:rgb(232, 213, 213);
            position:relative;
        }
        .sub1{
            width:90vw;
            height:95vh;
            background-color: rgb(156, 218, 197);
            position:absolute;
            left:5vw;
            top:5vw;

        }

            width:90vw;
            height:95vh;

        }
        .sub2{
            width:50vw;
            height:40vh;
            background-color:rgb(235, 235, 100,0.3);
            border: 1px solid whitesmoke;
            border-radius: 30px;
            position:absolute;
            left:10vw;
            top:20vw;
            font-size: 90px;
            box-shadow: 5px 5px 5px whitesmoke;
        }
        h2{
            margin:0;
            color: black;
        }
        .Box{
            width:15vw;
            height:26vh;
            background-color:rgb(227, 209, 209);
            display: flex;
            align-items: center;
            justify-content:center;
            
        }
        .Box img{
            width:13vw;
            height:23vh;
        }
        .sub3{
            position: absolute;
            top:6vw;
            right:10vw;

        }
        .sub4{
            position: absolute;
            top:16vw;
            right:20vw;

        }
        .sub5{
            position: absolute;
            top:26vw;
            right:10vw;

        }
        .sub6{
            position: absolute;
            top:36vw;
            right:18vw;
        }
        .sub7{
            position:absolute;
            top:0px;
        }
        .sub7 img{
            width:100px;
            border-radius:100px;
        }
        .second{
            width:100vw;
            height:100vh;
            background-color:rgb(232, 213, 213);
        }
        .Box:hover{
            transform:scale(1.1);
            z-index:1;
            background-color: bisque;

        }
    </style>
