<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tune track</title>
    <style>
        body{
            background-color:rgb(232, 213, 213);
            margin:0;
        }
        .main{
            width:100vw;
            height:100vh;
            background-color:rgb(232, 213, 213);
            position:relative;
        }
        .sub1{
            width:90vw;
            height:90vh;
            background-color:rgb(242, 179, 84);
            position:absolute;
            left:5vw;
            top:5vw;
        }
        .sub1 img{
            width:90vw;
            height:90vh;

        }
        .sub2{
            width:50vw;
            height:40vh;
            background-color:rgb(235, 235, 100,0.3);
            border: 1px solid whitesmoke;
            border-radius: 30px;
            position:absolute;
            left:10vw;
            top:20vw;
            font-size: 90px;
            box-shadow: 5px 5px 5px whitesmoke;
        }
        h2{
            margin:0;
            color: black;
        }
        .Box{
            width:15vw;
            height:26vh;
            background-color:rgb(227, 209, 209);
            display: flex;
            align-items: center;
            justify-content:center;
            
        }
        .Box img{
            width:13vw;
            height:23vh;
        }
        .sub3{
            position: absolute;
            top:6vw;
            right:10vw;

        }
        .sub4{
            position: absolute;
            top:16vw;
            right:20vw;

        }
        .sub5{
            position: absolute;
            top:26vw;
            right:10vw;

        }
        .sub6{
            position: absolute;
            top:36vw;
            right:18vw;
        }
        .sub7{
            position:absolute;
            top:10px;
            left:10px;
            z-index:1;
        }
        .sub7 img{
            width:70px;
            position: absolute;
            top:2vw;
        }
        .second{
            position: relative;
            width:100vw;
            height:100vh;
            background-color:rgb(232, 213, 213);
        }
        .Box:hover{
            transform:scale(1.1);
            z-index:1;
            background-color: bisque;

        }
        .box1{
            width:42vw;
            height:50vh;
            position: absolute;
            top:20vh;
            left:5vw;
            background-color:rgb(254, 174, 56);
            display: flex;
            flex-direction:column;
            align-items:center;
            justify-content: center;
            font-size: x-large;
            border-radius:50px;
        }
        input{
            display:block;
            width:200px;
            height:30px;
            margin-bottom: 20px;
            border-radius: 20px;

        }
        button{
            width:100px;
            height:40px;
            background-color:rgb(237, 147, 13);
            font-size: x-large;
            border-radius:30px;
            border:3px solid whitesmoke
        }
        ::placeholder{
            padding:left;
            font-size: larger;
            color: black;
            align-items: center;
        }
        .box2{
            width:50vw;
            height:100vh;
            background-color:rgb(254, 174, 56);;
            position: absolute;
            top:20px;
            right: 0vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box2 img{
            width:46vw;
            height:94vh;
            border: 3px solid white;
            border-radius:13px;

        }
    </style>
</head>
